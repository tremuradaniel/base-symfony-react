server {
    listen 80;
    server_name localhost;
    root /var/www/html/backend/public;

    error_log  /var/log/nginx/error.log;
    access_log /var/log/nginx/access.log;

    # Use Docker's internal DNS resolver to resolve upstream hosts at runtime
    resolver 127.0.0.11 valid=10s ipv6=off;

    # All /api/* requests go to Symfony via PHP-FPM
    location /api {
        try_files $uri /index.php$is_args$args;
    }

    # PHP-FPM handler (only reachable via try_files internal redirect)
    location ~ ^/index\.php(/|$) {
        set $phpupstream php:9000;
        fastcgi_pass $phpupstream;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        internal;
    }

    # Everything else → React/Vite dev server
    location / {
        set $frontend http://frontend:5173;
        proxy_pass $frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Deny direct .php access
    location ~ \.php$ {
        return 404;
    }
}
